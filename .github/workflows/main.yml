name: SLUG wallet foundation

on:
  push:
    branches: [slug-wallet-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slugwallet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.4'
  # Reviewed paired set23 chain implementation; do not float this dependency.
  SLUG_CHAIN_REF: 4dc49e103ce271981a20a08a115dbfacc6aa6891
  GOFLAGS: ''

defaults:
  run:
    shell: bash
    working-directory: slugwallet

jobs:
  modules:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          path: slugwallet
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: taytr-llc/slug
          ref: ${{ env.SLUG_CHAIN_REF }}
          path: slug
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            slugwallet/**/go.sum
            slug/**/go.sum
      - name: Paired connection cancellation regressions
        working-directory: slug
        run: go test -race -count=1 -timeout=2m ./rpcclient
      - name: Independent public fixture oracles
        run: |
          python3 waddrmgr/testdata/reencode_vectors.py --check
          python3 integration/testdata/reference_addresses.py --check
      - name: Format and dependency identity
        run: |
          test -z "$(git ls-files '*.go' | xargs gofmt -l)"
          go list -deps ./... > "$RUNNER_TEMP/wallet-dependencies.txt"
          if grep -Eq '^github.com/btcsuite/(btcd|btcwallet)(/|$)' "$RUNNER_TEMP/wallet-dependencies.txt"; then
            echo 'Upstream Bitcoin runtime dependency found'
            exit 1
          fi
      - name: Six runtime module builds, tests, and vet
        run: |
          for module in . wallet/txauthor wallet/txrules wallet/txsizes walletdb wtxmgr; do
            (cd "$module" && go build ./... && go test -parallel=2 -count=1 -timeout=5m ./... && go vet ./...)
          done
      - name: Runtime race checks
        run: |
          go test -race -parallel=2 -count=1 -timeout=20m . ./chain ./wallet ./waddrmgr
          for module in wallet/txauthor wallet/txrules wallet/txsizes walletdb wtxmgr; do
            (cd "$module" && go test -race -count=1 -timeout=3m ./...)
          done
      - name: Disabled cheap-profile daemon
        run: go test -tags=slugtestpow -count=1 -timeout=30s . ./chain
      - name: Namespace and sample configuration
        run: |
          mkdir -p "$RUNNER_TEMP/slugwallet-bin"
          go build -o "$RUNNER_TEMP/slugwallet-bin/slugwallet" .
          PATH="$RUNNER_TEMP/slugwallet-bin:$PATH" scripts/check-sample-slugwallet-conf.sh

  production-pow-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: slugwallet
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: taytr-llc/slug
          ref: ${{ env.SLUG_CHAIN_REF }}
          path: slug
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            slugwallet/**/go.sum
            slug/**/go.sum
      - name: Build normal SLUG node
        working-directory: slug
        run: go build -tags= -o "$RUNNER_TEMP/slugd" .
      - name: Isolated fixture restore and spend
        env:
          SLUG_WALLET_NODE: ${{ runner.temp }}/slugd
        run: ./integration/run-foundation.sh
