name: SLUG wallet desktop foundation

on:
  push:
    branches: [slug-wallet-foundation, slug-wallet-recovery, slug-phase-a-activation, slug-desktop-wallet, slug-account-enrollment, slug-recovery-vault, slug-production-profile, slug-resumable-recovery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slugwallet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.4'
  # Set32 uses the validated provider coordinator and unchanged Phase-A chain.
  SLUG_CHAIN_REF: 55c480fba51f4de919e0ada0d4bbae3b29e9ba0a
  GOFLAGS: ''

defaults:
  run:
    shell: bash
    working-directory: slugwallet

jobs:
  modules:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          path: slugwallet
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: taytr-llc/slug
          ref: ${{ env.SLUG_CHAIN_REF }}
          path: slug
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            slugwallet/**/go.sum
            slug/**/go.sum
      - name: Paired connection cancellation regressions
        working-directory: slug
        run: go test -race -count=1 -timeout=2m ./rpcclient
      - name: Paired account and identity authority regressions
        working-directory: slug
        run: go test -race -count=1 -timeout=5m ./gymaccount ./gymidentity
      - name: Independent public fixture oracles
        run: |
          python3 waddrmgr/testdata/reencode_vectors.py --check
          python3 integration/testdata/reference_addresses.py --check
          python3 recovery/testdata/reference_recovery.py --check
          python3 productionprofile/testdata/reference_profile.py --check
          python3 productionprofile/testdata/reference_recovery_indices.py --check
          python3 recoveryvault/testdata/reference_vault.py --check
          python3 integration/testdata/reference_recovery_highwater.py --check
      - name: Format and dependency identity
        run: |
          test -z "$(git ls-files '*.go' | xargs gofmt -l)"
          go list -deps ./... > "$RUNNER_TEMP/wallet-dependencies.txt"
          if grep -Eq '^github.com/btcsuite/(btcd|btcwallet)(/|$)' "$RUNNER_TEMP/wallet-dependencies.txt"; then
            echo 'Upstream Bitcoin runtime dependency found'
            exit 1
          fi
      - name: Six runtime module builds, tests, and vet
        run: |
          for module in . wallet/txauthor wallet/txrules wallet/txsizes walletdb wtxmgr; do
            (cd "$module" && go build ./... && go test -parallel=2 -count=1 -timeout=10m ./... && go vet ./...)
          done
      - name: Runtime race checks
        run: |
          go test -race -parallel=2 -count=1 -timeout=60m . ./chain ./wallet ./waddrmgr ./rpc/legacyrpc ./recoveryvault ./productionprofile
          for module in wallet/txauthor wallet/txrules wallet/txsizes walletdb wtxmgr; do
            (cd "$module" && go test -race -count=1 -timeout=3m ./...)
          done
      - name: Disabled cheap-profile daemon
        run: |
          go test -tags=slugtestpow -count=1 -timeout=30s . ./chain
          go test -tags=slugtestpow -count=1 -timeout=1m ./recovery ./recoveryvault ./productionprofile
          go test -tags=slugtestpow -count=1 -timeout=1m ./wallet -run '^(TestRecovery|TestCandidate|TestAccountChallengeCheapProfileRefusal)'
      - name: Namespace and sample configuration
        run: |
          mkdir -p "$RUNNER_TEMP/slugwallet-bin"
          go build -o "$RUNNER_TEMP/slugwallet-bin/slugwallet" .
          PATH="$RUNNER_TEMP/slugwallet-bin:$PATH" scripts/check-sample-slugwallet-conf.sh

  production-pow-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: slugwallet
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: taytr-llc/slug
          ref: ${{ env.SLUG_CHAIN_REF }}
          path: slug
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            slugwallet/**/go.sum
            slug/**/go.sum
      - name: Build normal SLUG node
        working-directory: slug
        run: go build -tags= -o "$RUNNER_TEMP/slugd" .
      - name: Isolated fixture restore and spend
        env:
          SLUG_WALLET_NODE: ${{ runner.temp }}/slugd
        run: ./integration/run-foundation.sh
      - name: Retained phrase and gym restore under normal PoW
        env:
          SLUG_WALLET_NODE: ${{ runner.temp }}/slugd
        run: ./integration/run-recovery.sh
      - name: Activated four-scope recovery and witness block template
        env:
          SLUG_WALLET_NODE: ${{ runner.temp }}/slugd
        run: ./integration/run-activation.sh
      - name: Candidate profile four-scope restore and native change
        env:
          SLUG_WALLET_NODE: ${{ runner.temp }}/slugd
        run: ./integration/run-candidate.sh
      - name: Resumable high-index file-only recovery and spend
        env:
          SLUG_WALLET_NODE: ${{ runner.temp }}/slugd
        run: sh ./integration/run-resumable.sh
      - name: Maximum supported recovery watch inventory
        env:
          SLUG_WALLET_NODE: ${{ runner.temp }}/slugd
          SLUG_RECOVERY_BENCH: '1'
        run: go test -tags=integration -run '^TestRecoveryMaximumWatchNormalNode$' -count=1 -timeout=5m -v ./wallet
